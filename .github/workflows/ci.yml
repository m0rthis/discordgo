on:
  push:
  pull_request:

name: CI

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22", "stable"]
    steps:
      - name: Code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Go build
        run: go build ./...
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test -race ./...
